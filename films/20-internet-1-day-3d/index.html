    const walking = r() < .5, side = r() < .5 ? -1 : 1; let x, z0, tries = 0; do { x = walking ? side * (2.4 + r() * 3.4) : (r() - .5) * 11; z0 = -3 - r() * 60; tries++; } while (tries < 40 && CROWD.some(c => Math.hypot(c.x - x, c.z0 - z0) < (walking || c.walking ? .75 : 1.1))); const dir = walking ? (side > 0 ? -1 : 1) : 1;

// ---------------- 2D overlay: minimal (hook, 24-hour clock, one fact at a time, captions) ----------------
function tx(s, x, y, size, font, col, align = 'left', glow = 0, glowCol = null) { X.font = `${size}px ${font}`; X.textAlign = align; X.textBaseline = 'alphabetic'; if (glow) { X.shadowColor = glowCol || col; X.shadowBlur = glow; } X.fillStyle = col; X.fillText(s, x, y); X.shadowBlur = 0; }

const CX = 504; const fade = (t, a, b, fi = .2, fo = .2) => clamp((t - a) / fi) * (1 - clamp((t - b + fo) / fo));

  { const al = 1 - clamp((t - T.r2 + .1) / .3); if (al > 0) { X.globalAlpha = al; rich([['What if the ', '#ffffff'], ['internet', '#5FD2FF']], CX, 250, 70, PF); rich([['went down for ', '#ffffff'], ['one whole day', '#ffcf6a'], ['?', '#ffffff']], CX, 336, 60, PF); X.globalAlpha = 1; } }

  statBlock(t, T.r2 + .2, T.w3, '12,000,000', 'Canadians offline · debit down nationwide', 'Rogers outage, July 8, 2022', 470, 120);
  statBlock(t, T.w3 + .1, T.h7, 'Now: the whole world', null, null, 470, 84);
  statBlock(t, T.h12 + .3, T.h18, '5,000+ flights', 'cancelled by one bad update', 'CrowdStrike outage, July 19, 2024', 470, 110);
  { const al = fade(t, T.HIT, T.q, .05, .3); if (al > 0) { X.globalAlpha = al; const p = back(clamp((t - T.HIT) / .4), 1.8); X.save(); X.translate(CX, 470); X.scale(p, p); tx('$43,000,000,000', 0, 0, 108, PF, '#ffd36a', 'center', 40, 'rgba(255,190,60,.9)'); tx('the cost of ONE day offline', 0, 66, 46, PFI, '#fff1d6', 'center', 14, 'rgba(0,0,0,.9)'); tx('model estimate · Atlas VPN / NetBlocks', 0, 110, 27, MONO, 'rgba(240,230,210,.8)', 'center', 8, 'rgba(0,0,0,.9)'); X.restore(); X.globalAlpha = 1; } }

  for (const [n, u] of FONTS) { const f = new FontFace(n, `url(${u})`); await f.load(); document.fonts.add(f); }
