  tx('LIFESPAN SCAN', W / 2, 900, 30, MONO, 'rgba(200,240,255,.9)'); tx(k < 1 ? 'CALIBRATING' : 'ON', W / 2, 945, 24, MONO, k < 1 ? 'rgba(200,240,255,.5)' : 'rgba(150,255,200,.9)'); X.restore(); }

function serif(t) { for (const [a, b, s] of TEXT) { if (t < a || t > b) continue; const al = clamp((t - a) / .45) * (1 - clamp((t - b + .45) / .45)); const lines = s.split('|');
