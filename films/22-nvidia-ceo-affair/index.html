// ================= TIMELINE =================
const SH = [];
function shot(name, t0, t1, fn) { SH.push({ name, t0, t1, fn }); }
function timeline() {
  T.affair = word('n1', 'affair') - .1; T.l2 = L0('n2') - .05; T.l3 = L0('n3') - .05; T.charged = word('n3', 'charged') - .3; T.l4 = L0('n4') - .05; T.l5 = L0('n5') - .05; T.l6 = L0('n6') - .05; T.tril = word('n6', 'trillion') - .3;
  T.l7 = L0('n7') - .05; T.l8 = L0('n8') - .05; T.cong = word('n8', 'congress') - .1; T.l9 = L0('n9') - .05; T.S0 = F.S0; T.HIT = F.HIT; T.q = L0('n11') - .05;
  shot('hook', 0, T.l2, sHook); shot('letter', T.l2, T.l3, sLetter); shot('map', T.l3, T.l4, sMap); shot('board', T.l4, T.l5, sBoard); shot('dcwide', T.l5, T.l6, sDCwide); shot('dc', T.l6, T.l7, sDC);
  shot('stock', T.l7, T.l8, sStock); shot('cap', T.l8, T.l9, sCap); shot('crack', T.l9, T.HIT, sCrack); shot('ripple', T.HIT, T.q, sRipple); shot('end', T.q, F.dur + 1, sEnd);
  const ev = [];
  ev.push({ t: 0, type: 'city', d: T.affair + .2 }, { t: T.affair, type: 'snap' }, { t: T.affair + .05, type: 'powerdown' });
  for (const at of [T.l2, T.l3, T.l4, T.l5, T.l6, T.l7, T.l8, T.cong, T.l9]) ev.push({ t: at - .05, type: 'whoosh', g: .7 }, { t: at + .05, type: 'hour' });
  ev.push({ t: T.charged + .3, type: 'thud' }, { t: word('n7', 'fell') - .05, type: 'beepfail' }, { t: T.S0, type: 'silence' }, { t: T.HIT, type: 'hit' }, { t: T.q + .1, type: 'chime' });
  EV = ev.sort((a, b) => a.t - b.t);
}

const ST = {}; const camF = (p, l, fov, roll = 0) => cam(p, l, fov, roll, .05, 3000); const W2 = (k, x, y, z) => POS[k].clone().add(V(x, y, z));

  keyL.intensity = 1.2; keyL.color.set(0xffffff); keyL.position.set(4, 8, 6); keyL.castShadow = false; rimL.intensity = .6; }
function chipShot(t, k, red, camP, look, fov) { show('chip'); drawCrack(k, red); keyL.position.set(-6, 10, 8); keyL.intensity = 1.4; rimL.intensity = 1.0; camF(camP, look, fov, 0); }

function sLetter(u, t) { show('letter'); camF(W2('letter', lerp(-.3, .3, u), lerp(3.4, 3.2, u), lerp(12, 10.5, eio(u))), W2('letter', 0, 3.7, -2), 52, lerp(-.02, .02, u)); bloom.threshold = 1.3; ST.flash = cutF(); }
function sMap(u, t) { show('map'); const U = SETS.map.userData; U.tube.material.uniforms.uK.value = eo(seg(t, T.l3 + .3, T.l3 + 2)); U.tube.material.uniforms.uT.value = t; U.stamp.visible = t > T.charged; U.stamp.scale.setScalar(t > T.charged ? lerp(2.2, 1, eo(seg(t, T.charged, T.charged + .2))) : 1);
  camF(W2('map', lerp(-.8, .8, u), lerp(11, 10, u), lerp(13, 11.5, u)), W2('map', lerp(-.2, .2, u), 0, -1), 52, lerp(-.02, .02, u)); ST.flash = Math.max(cutF(), t > T.charged ? .3 * Math.exp(-(t - T.charged) * 7) : 0); ST.flashCol = [1.4, .6, .6]; }
function sBoard(u, t) { show('board'); scene.background = BG.board; keyL.intensity = .2; camF(W2('board', lerp(-3, -1, u), lerp(4.5, 3.6, u), lerp(7, 5, eio(u))), W2('board', 0, 1.2, .2), 44, lerp(-.03, .02, u)); ST.flash = cutF(); }
function sDCwide(u, t) { show('dc'); scene.background = BG.dc; dcLeds(t); camF(W2('dc', 0, lerp(2.4, 2.0, u), lerp(6, -4, eio(u))), W2('dc', 0, 1.8, -60), 52, 0); ST.flash = cutF(); }
function sDC(u, t) { show('dc'); scene.background = BG.dc; dcLeds(t); camF(W2('dc', lerp(-.6, .6, u), lerp(1.8, 2.6, u), lerp(-6, -22, u)), W2('dc', 0, lerp(1.8, 2.2, u), -70), 54, lerp(-.03, .03, u)); ST.flash = cutF(); }

  camF(W2('stock', lerp(-.5, .3, u), lerp(.6, .2, u), lerp(11, 10, u)), W2('stock', 0, .3, 0), 50, lerp(-.02, .02, u)); ST.flash = cutF(); }
function sCap(u, t) { show('cap'); const C = SETS.cap.userData.cal; const flip = eio(seg(t, T.cong - .3, T.cong + .2)); C.a.rotation.x = -flip * Math.PI * .5; C.a.position.y = 1.4 * (1 - Math.cos(flip * Math.PI * .5)) * 0; C.a.visible = flip < .98;
  keyL.position.set(-10, 20, 10); keyL.intensity = .9; bloom.threshold = 1.2; camF(W2('cap', lerp(-1, 1, u), lerp(3.4, 4.2, u), lerp(10, 12, u)), W2('cap', 0, lerp(4.2, 6.5, eio(u)), -8), 50, 0); ST.flash = cutF(); }
function sCrack(u, t) { const k = .35 + .65 * ei(seg(t, T.l9 + .2, T.S0)); chipShot(t, k, t > T.S0 ? 1 : 0, V(lerp(-1, 0, u), lerp(8, 7.2, u), lerp(5, 3.6, ei(u))), V(0, .5, 0), 44); ST.flash = cutF(); if (t >= T.S0) ST.desat = .55; }

function sEnd(u, t) { const k = seg(t, T.q, F.dur); chipShot(t, 1, 1, V(lerp(-4, -7, k), lerp(8, 10, k), lerp(9, 11, k)), V(0, .4, 0), 44); ST.flash = cutF(); }

let CUR = { t: 0, t0: 0 }; const cutF = (k = .14) => k * (1 - eo(clamp((CUR.t - CUR.t0) / .12)));
function frame(t) {
  resetFrame();
  for (const k in SETS) if (SETS[k].visible !== false) SETS[k].traverse(o => { if (o.material && o.material.uniforms && o.material.uniforms.uTime) o.material.uniforms.uTime.value = t; });
  let s = SH.find(x => t >= x.t0 && t < x.t1) || SH[SH.length - 1]; ST.shot = s.name; CUR = { t, t0: s.t0 };
  s.fn(clamp((t - s.t0) / (s.t1 - s.t0)), t, s);
  grade.uniforms.uFlash.value = clamp(ST.flash * .22); grade.uniforms.uFlashCol.value.setRGB(...ST.flashCol); grade.uniforms.uDesat.value = ST.desat; grade.uniforms.uCA.value = ST.ca; grade.uniforms.uStreak.value = ST.streak;
}

// ---------------- 2D overlay ----------------
function tx(s, x, y, size, font, col, align = 'left', glow = 0, glowCol = null) { X.font = `${size}px ${font}`; X.textAlign = align; X.textBaseline = 'alphabetic'; if (glow) { X.shadowColor = glowCol || col; X.shadowBlur = glow; } X.fillStyle = col; X.fillText(s, x, y); X.shadowBlur = 0; }
function stroked(s, x, y, size, font, col, align = 'center') { X.font = `${size}px ${font}`; X.textAlign = align; X.lineJoin = 'round'; X.shadowColor = 'rgba(0,0,0,.8)'; X.shadowBlur = 20; X.shadowOffsetY = 4; X.strokeStyle = 'rgba(0,0,0,.6)'; X.lineWidth = 9; X.strokeText(s, x, y); X.shadowBlur = 0; X.shadowOffsetY = 0; X.fillStyle = col; X.fillText(s, x, y); }
const CX = 504; const fade = (t, a, b, fi = .2, fo = .2) => clamp((t - a) / fi) * (1 - clamp((t - b + fo) / fo));
function rich(parts, x, y, size, font) { X.font = `${size}px ${font}`; const tw = parts.reduce((a, [s]) => a + X.measureText(s).width, 0); let cx = x - tw / 2; for (const [s, c] of parts) { tx(s, cx, y, size, font, c, 'left', 14, 'rgba(0,0,0,.85)'); cx += X.measureText(s).width; } }
function statBlock(t, a, b, big, line, src_, y = 300, size = 110, col = '#ffffff', gl = 'rgba(124,255,178,.5)') { const al = fade(t, a, b, .2, .25); if (al <= 0) return; X.globalAlpha = al; const p = lerp(.92, 1, eo(clamp((t - a) / .4)));
  X.save(); X.translate(CX, y); X.scale(p, p); tx(big, 0, 0, size, PF, col, 'center', 30, gl); if (line) tx(line, 0, 62, 44, PFI, '#e6eefc', 'center', 14, 'rgba(0,0,0,.9)'); if (src_) tx(src_, 0, 104, 27, MONO, 'rgba(210,222,245,.85)', 'center', 8, 'rgba(0,0,0,.9)'); X.restore(); X.globalAlpha = 1; }
function overlay(t) {
  X.clearRect(0, 0, W, H);
  const gr = X.createLinearGradient(0, 0, 0, 560); gr.addColorStop(0, 'rgba(2,3,10,.75)'); gr.addColorStop(1, 'rgba(2,3,10,0)'); X.fillStyle = gr; X.fillRect(0, 0, W, 560);
  { const al = 1 - clamp((t - T.l2 + .1) / .3); if (al > 0) { X.globalAlpha = al; rich([['The most powerful man in ', '#ffffff'], ['AI', '#7CFFB2']], CX, 240, 62, PF); rich([['just admitted an ', '#ffffff'], ['affair', '#ff8a7a']], CX, 320, 70, PF); tx('NEWS · NOV 8, 2026', CX, 380, 30, MONO, 'rgba(220,230,250,.85)', 'center', 8, 'rgba(0,0,0,.9)'); X.globalAlpha = 1; } }
  statBlock(t, T.l2, T.l3, 'Letter to staff', 'Nvidia CEO Jensen Huang apologizes', 'Nov 8, 2026 · Axios, CNN', 300, 96);
  statBlock(t, T.l3 + .1, T.l4, 'Reported', 'watched by US intelligence over China ties', 'NYT / NBC reporting · no charges filed', 300, 96, '#ffd0c8', 'rgba(255,90,90,.5)');
  statBlock(t, T.l4, T.l5, 'Board investigation', '“no reason to believe” secrets were compromised', 'Nvidia board statement · Nov 8, 2026', 300, 90);
  statBlock(t, T.l6 + .1, T.tril, '~80%', 'of AI data-center chips are Nvidia’s', 'IDC estimate, 2026 (range ~70–90%)', 300, 130);
  statBlock(t, T.tril, T.l7, '$4.5 trillion', 'company value', 'Al Jazeera, Nov 9, 2026', 300, 120);
  statBlock(t, T.l7 + .1, T.l8, '−5%', 'Nvidia stock · Monday, Nov 9', 'CNBC, CNN', 300, 160, '#ff6a6a', 'rgba(255,60,60,.6)');
  statBlock(t, T.cong, T.l9, 'Nov 18', 'House chairs request a closed-door briefing', 'voluntary request, not a subpoena · Axios', 300, 120);
  if (t > T.l3 && t < T.l5) { X.globalAlpha = .8 * fade(t, T.l3, T.l5); tx('Allegations as reported by news outlets.', CX, 1600, 26, MONO, 'rgba(220,226,240,.85)', 'center', 6, 'rgba(0,0,0,.9)'); tx('No charges have been filed.', CX, 1636, 26, MONO, 'rgba(220,226,240,.85)', 'center', 6, 'rgba(0,0,0,.9)'); X.globalAlpha = 1; }
  if (t >= T.q) { const a = eo(clamp((t - T.q) / .4)); X.globalAlpha = a; rich([['Should he ', '#ffffff'], ['stay', '#7CFFB2'], [' as CEO?', '#ffffff']], CX, 290, 72, PF);
    const b = back(clamp((t - word('n11', 'comment') + .3) / .35), 2); for (const [lab, x, col] of [['YES', CX - 190, '#3ee08a'], ['NO', CX + 190, '#ff5a5a']]) { X.save(); X.translate(x, 1060); X.scale(b, b); rr(X, -140, -76, 280, 116, 58); X.fillStyle = 'rgba(6,10,20,.85)'; X.fill(); X.lineWidth = 6; X.strokeStyle = col; X.stroke(); tx(lab, 0, 12, 80, AN, col, 'center', 20, col); X.restore(); }
    tx('comment below 👇', CX, 1170, 50, `${PFI}, ${EMO}`, '#e6eefc', 'center', 12, 'rgba(0,0,0,.9)'); X.globalAlpha = 1; }
  const c = t < T.q ? CAPS.find(c => t >= c.t0 && t < c.t1) : null;
  if (c) { const size = 76, y = 1300; X.font = `${size}px ${BX}`;
    const parts = c.w.map(([w, h]) => [w, h, X.measureText(w + ' ').width]); const tw = parts.reduce((a, p) => a + p[2], 0) - X.measureText(' ').width;
    const pop = lerp(.9, 1, back(clamp((t - c.t0) / .12), 2)); const sc = Math.min(1, 860 / tw); X.save(); X.translate(CX, y); X.scale(pop * sc, pop * sc);
    let x = -tw / 2; for (const [w, h, ww] of parts) { stroked(w, x, 0, size, BX, h ? CSS.yel : '#fff', 'left'); x += ww; } X.restore(); }
}

// ---------------- boot ----------------
async function boot() {
  for (const [n, u] of FONTS) { const f = new FontFace(n, `url(${u})`); await f.load(); document.fonts.add(f); }
  [F, CAPS, LAND] = await Promise.all(['film.json', 'caps.json', 'data/land.json'].map(u => fetch(u).then(r => r.json())));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  timeline(); buildChip(); buildLetter(); buildMap(); buildBoard(); buildDC(); buildStock(); buildCap();
  window.DUR = F.dur; window.EV = EV; window.T = T; window.SH = SH; window.DBG = { camera, scene, ST, grade, bloom };
  window.render = t => { frame(t); composer.render(); overlay(t); };
  window.render(0.5); window.READY = true;
}
boot();
