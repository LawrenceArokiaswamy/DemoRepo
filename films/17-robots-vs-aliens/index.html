  camW(head.clone().add(V(lerp(.25, .1, k), .02, lerp(1.6, .85, ei(k)))), head, 40, 0); ST.desat = t >= T.S0 ? .75 : .6; ST.flash = cutF(); }
function sNo(u, t) { world(t); const dz = armyZ(t); camW(V(lerp(0, 3, u), lerp(2.2, 6, u), dz + lerp(4, 12, u)), V(0, 2, dz - 30), 50, 0); ST.flash = .9 * (1 - eo(seg(t, T.HIT, T.HIT + .2))); ST.flashCol = [.6, 1.1, 1.8]; bloom.strength = 1.2; }
function sClimb(u, t) { world(t); camW(V(lerp(-30, -10, u), lerp(10, 24, u), lerp(60, 70, u)), V(0, lerp(30, 70, u), -150), 54, lerp(-.04, .02, u)); ST.flash = cutF(); }
function sGiant(u, t) { world(t); camW(V(lerp(-10, 25, eio(u)), lerp(24, 8, eio(u)), lerp(80, 60, u)), V(0, lerp(70, 85, u), -170), lerp(54, 58, u), 0); ST.flash = t > T.mtn ? .5 * Math.exp(-(t - T.mtn) * 5) : 0; ST.flashCol = [.7, 1.2, 1.8]; }
function sBack(u, t) { world(t); camW(V(lerp(110, 130, u), lerp(12, 18, u), lerp(10, 30, u)), V(-20, lerp(110, 140, u), -330), 56, 0); ST.flash = cutF(); }
function sPunch(u, t) { world(t); const k = seg(t, T.cta, F.dur); camW(V(lerp(60, 30, k), lerp(5, 4, k), lerp(90, 130, k)).add(shake(t, t > T.punch + .4 && t < T.punch + 1.6 ? .6 : 0)), V(0, lerp(120, 95, k), -260), 58, lerp(.04, .01, k));
  ST.flash = t > T.punch + .45 ? .55 * Math.exp(-(t - T.punch - .45) * 3) : 0; ST.flashCol = [1.6, 1.4, 1.1]; }

let CUR = { t: 0, t0: 0 }; const cutF = (k = .14) => k * (1 - eo(clamp((CUR.t - CUR.t0) / .12)));
function frame(t) {
  resetFrame();
  for (const k in SETS) if (SETS[k].visible !== false) SETS[k].traverse(o => { if (o.material && o.material.uniforms && o.material.uniforms.uTime) o.material.uniforms.uTime.value = t; });
  let s = SH.find(x => t >= x.t0 && t < x.t1) || SH[SH.length - 1]; ST.shot = s.name; CUR = { t, t0: s.t0 };
  s.fn(clamp((t - s.t0) / (s.t1 - s.t0)), t, s);
  grade.uniforms.uFlash.value = clamp(ST.flash * .22); grade.uniforms.uFlashCol.value.setRGB(...ST.flashCol); grade.uniforms.uDesat.value = ST.desat; grade.uniforms.uCA.value = ST.ca; grade.uniforms.uStreak.value = ST.streak;
}

// ---------------- 2D overlay ----------------
function tx(s, x, y, size, font, col, align = 'left', glow = 0, glowCol = null) { X.font = `${size}px ${font}`; X.textAlign = align; X.textBaseline = 'alphabetic'; if (glow) { X.shadowColor = glowCol || col; X.shadowBlur = glow; } X.fillStyle = col; X.fillText(s, x, y); X.shadowBlur = 0; }
function fitTx(s, x, y, size, font, col, maxW, glow, glowCol) { X.font = `${size}px ${font}`; const w = X.measureText(s).width; const sz = w > maxW ? size * maxW / w : size; tx(s, x, y, sz, font, col, 'center', glow, glowCol); }
function stroked(s, x, y, size, font, col, align = 'center') { X.font = `${size}px ${font}`; X.textAlign = align; X.lineJoin = 'round'; X.shadowColor = 'rgba(0,0,0,.8)'; X.shadowBlur = 20; X.shadowOffsetY = 4; X.strokeStyle = 'rgba(0,0,0,.6)'; X.lineWidth = 9; X.strokeText(s, x, y); X.shadowBlur = 0; X.shadowOffsetY = 0; X.fillStyle = col; X.fillText(s, x, y); }
const CX = 504, GLOW = 'rgba(255,170,30,.85)', SRC = 'rgba(230,222,250,.92)', CGLOW = 'rgba(60,180,255,.95)', RGL = 'rgba(255,60,40,.95)', GGL = 'rgba(80,255,140,.9)';
const fade = (t, a, b, fi = .15, fo = .15) => clamp((t - a) / fi) * (1 - clamp((t - b + fo) / fo));
function head(lines, t, a, b, y0 = 205, size = 92, step = 104) {
  let y = y0; lines.forEach((L, i) => { const [s, at, col, sz0, gl] = L; const sz = sz0 || size, nz = lines[i + 1] ? (lines[i + 1][3] || size) : size;
    const kick = sz < size ? (size - sz) * step / size : 0; const al = fade(t, at, b, .12) * (a <= t ? 1 : 0);
    if (al > 0) { X.globalAlpha = al; const pop = back(clamp((t - at) / .3), 1.6); X.save(); X.translate(CX, y - kick); X.scale(lerp(.8, 1, pop), lerp(.8, 1, pop)); fitTx(s, 0, 0, sz, AN, col || CSS.gold, 880, 26, gl || GLOW); X.restore(); X.globalAlpha = 1; }
    y += (kick ? sz : Math.max(sz, nz)) * step / size; });
}
function src(s, y, t, a, b) { const al = fade(t, a, b); if (al > 0) { X.globalAlpha = al; X.font = `32px ${BS}`; const w = X.measureText(s).width; rr(X, CX - w / 2 - 18, y - 32, w + 36, 44, 22); X.fillStyle = 'rgba(14,4,8,.66)'; X.fill(); tx(s, CX, y, 32, BS, SRC, 'center', 8, 'rgba(0,0,0,.9)'); X.globalAlpha = 1; } }
function bigNum(s, y, t, a, b, size = 230, col = CSS.gold2, x = CX, gl = GLOW) { const al = fade(t, a, b, .1); if (al > 0) { X.globalAlpha = al; const nb = back(clamp((t - a) / .35), 1.8); X.save(); X.translate(x, y); X.scale(nb, nb); tx(s, 0, 0, size, AN, col, 'center', 44, gl); X.restore(); X.globalAlpha = 1; } }
function topShade(t, a, b, h = 470) { const al = fade(t, a, b); if (al <= 0) return; const gr = X.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, `rgba(8,2,4,${.75 * al})`); gr.addColorStop(1, 'rgba(8,2,4,0)'); X.fillStyle = gr; X.fillRect(0, 0, W, h); }
function overlay(t) {
  X.clearRect(0, 0, W, H); topShade(t, 0, F.dur + 1);
  { const al = 1 - clamp((t - T.a0 + .1) / .15); if (al > 0) { X.globalAlpha = al; const pop = lerp(.92, 1, eo(clamp(t / .5))); X.save(); X.translate(CX, 250); X.scale(pop, pop); fitTx('FINAL DAY', 0, 0, 170, AN, '#ff4a3a', 900, 40, RGL); X.restore();
      if (t > T.aliens) { const p2 = back(clamp((t - T.aliens) / .3), 1.8); X.save(); X.translate(CX, 360); X.scale(p2, p2); fitTx('THE ALIENS ARE HERE', 0, 0, 80, AN, '#9dffb9', 880, 26, GGL); X.restore(); } X.globalAlpha = 1; } }
  head([['HUMANITY’S LAST ARMY', T.a0, '#e6eefc', 64, CGLOW], ['1,000,000 OPTIMUS ROBOTS', T.mil, '#9fd4ff', 92, CGLOW]], t, T.a0, T.charge + .02, 220);
  src('Optimus: Tesla’s humanoid robot, in production since 2026', 400, t, T.mil + .3, T.charge + .02);
  bigNum('CHARGE!', 330, t, T.charge, T.lose + .02, 200, '#ffffff', CX, CGLOW);
  if (t > T.lose && t < T.ms + .02) { const k = eo(seg(t, T.lose + .2, T.ms)); const n = Math.round(lerp(1000000, 180000, k) / 1000) * 1000; head([['ROBOTS LEFT', T.lose, '#ffb3a8', 64, RGL]], t, T.lose, T.ms + .02, 205); bigNum(n.toLocaleString('en-US'), 340, t, T.lose + .05, T.ms + .02, 150, '#ff5a4a', CX, RGL); }
  head([['THE MOTHERSHIP', T.ms, '#9dffb9', 92, GGL], ['10 KM WIDE', word('n5', 'ten') - .05, '#ffffff', 130, GGL]], t, T.ms, T.stop + .02, 220);
  head([['THEY STOPPED.', T.stop + .1, '#c8cbd6', 110, 'rgba(160,170,200,.6)']], t, T.stop + .1, T.q + .02, 230);
  head([['DID THEY GIVE UP?', T.q, '#ffffff', 110, 'rgba(160,170,200,.6)']], t, T.q, T.HIT, 230);
  bigNum('NO.', 360, t, T.HIT, T.calc + .1, 240, '#9fd4ff', CX, CGLOW); head([['THEY WERE', T.calc, '#e6eefc', 64, CGLOW], ['CALCULATING', word('n8', 'calculating') - .1, '#9fd4ff', 120, CGLOW]], t, T.calc, T.climb + .02, 220);
  head([['ARMS LOCK.', word('n9', 'arms') - .05, '#ffffff', 92, CGLOW], ['LEGS LOCK.', word('n9', 'legs') - .05, '#9fd4ff', 92, CGLOW]], t, word('n9', 'arms') - .05, T.one + .02, 220);
  if (t > T.one && t < T.back + .02) { head([['1,000,000 → 1', T.one, '#9fd4ff', 92, CGLOW], ['A GIANT THE SIZE', T.mtn - .5, CSS.gold], ['OF A MOUNTAIN', T.mtn, CSS.gold2, 130]], t, T.one, T.back + .02, 220); }
  head([['FOR THE FIRST TIME…', T.back, '#e6eefc', 64, CGLOW], ['THE ALIENS BACK AWAY', word('n11', 'aliens') - .1, '#9dffb9', 100, GGL]], t, T.back, T.cta + .02, 220);
  if (t >= T.cta) { const a = eo(clamp((t - T.cta - .5) / .35)); X.globalAlpha = a; const p = lerp(.9, 1, back(clamp((t - T.cta - .5) / .4), 1.6)); X.save(); X.translate(CX, 250); X.scale(p, p); fitTx('WHICH ARMY WINS?', 0, 0, 120, AN, CSS.gold2, 900, 34, GLOW); X.restore();
    const b = back(clamp((t - word('n12', 'one') + .05) / .35), 2); for (const [lab, x, col, gl] of [['1 GIANT 🗿', CX - 232, '#9fd4ff', CGLOW], ['1,000,000 🤖', CX + 232, '#ffd27a', GLOW]]) { const pul = 1 + .04 * Math.sin(t * 6 + x); X.save(); X.translate(x, 1060); X.scale(b * pul, b * pul); rr(X, -220, -86, 440, 136, 68); X.fillStyle = 'rgba(8,6,20,.88)'; X.fill(); X.lineWidth = 7; X.strokeStyle = col; X.stroke(); fitTx(lab, 0, 14, 76, `${AN}, ${EMO}`, col, 400, 20, gl); X.restore(); }
    tx('comment below 👇', CX, 1170, 54, `${BX}, ${EMO}`, '#ffffff', 'center', 12, CGLOW); X.globalAlpha = 1; }
  const c = t < T.cta ? CAPS.find(c => t >= c.t0 && t < c.t1) : null;
  if (c) { const size = 84, y = 1300; X.font = `${size}px ${BX}`;
    const parts = c.w.map(([w, h]) => [w, h, X.measureText(w + ' ').width]); const tw = parts.reduce((a, p) => a + p[2], 0) - X.measureText(' ').width;
    const pop = lerp(.9, 1, back(clamp((t - c.t0) / .12), 2)); const sc = Math.min(1, 860 / tw); X.save(); X.translate(CX, y); X.scale(pop * sc, pop * sc);
    let x = -tw / 2; for (const [w, h, ww] of parts) { stroked(w, x, 0, size, BX, h ? CSS.yel : '#fff', 'left'); x += ww; } X.restore(); }
}

// ---------------- boot ----------------
async function boot() {
  for (const [n, u] of FONTS) { const f = new FontFace(n, `url(${u})`); await f.load(); document.fonts.add(f); }
  [F, CAPS] = await Promise.all(['film.json', 'caps.json'].map(u => fetch(u).then(r => r.json())));
  timeline(); buildField();
  window.DUR = F.dur; window.EV = EV; window.T = T; window.SH = SH; window.DBG = { camera, scene, ST, grade, bloom };
  window.render = t => { frame(t); composer.render(); overlay(t); };
  window.render(0.5); window.READY = true;
}
boot();
