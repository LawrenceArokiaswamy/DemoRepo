  shot('hook', 0, T.ts, sHook); shot('square', T.ts, T.data, sSquare); shot('data', T.data, T.three, sData); shot('count', T.three, T.ZERO, sCount); shot('zero', T.ZERO, T.g5, sZero);

  const ev = [];
  ev.push({ t: 0, type: 'city', d: T.ZERO }, { t: 0, type: 'tick' }); for (let k = 1; k <= Math.floor(T.ZERO); k++) ev.push({ t: T.ZERO - k, type: 'tick' });
  ev.push({ t: T.ts - .05, type: 'whoosh', g: .7 }, { t: T.data - .05, type: 'whoosh', g: .7 }, { t: T.data, type: 'datahum', d: T.ZERO - T.data });
  for (const w of ['three', 'two', 'one']) ev.push({ t: word('n4', w), type: 'beat' });
  ev.push({ t: T.ZERO, type: 'snap' }, { t: T.ZERO, type: 'silence' }, { t: T.HIT, type: 'hit' });
  ev.push({ t: T.g5 + .1, type: 'spinner', d: T.e6 - T.g5 }, { t: T.e6, type: 'freeze' }, { t: T.c7 + .2, type: 'beepfail' }, { t: T.noc, type: 'dead' });
  ev.push({ t: T.BACK - 1.4, type: 'riser', d: 1.4 }, { t: T.BACK, type: 'reconnect' }, { t: T.q10 + .1, type: 'chime' });

}

// ---------------- 2D overlay: minimal (hook line, timer, one stat at a time, captions) ----------------
function tx(s, x, y, size, font, col, align = 'left', glow = 0, glowCol = null) { X.font = `${size}px ${font}`; X.textAlign = align; X.textBaseline = 'alphabetic'; if (glow) { X.shadowColor = glowCol || col; X.shadowBlur = glow; } X.fillStyle = col; X.fillText(s, x, y); X.shadowBlur = 0; }
function stroked(s, x, y, size, font, col, align = 'center') { X.font = `${size}px ${font}`; X.textAlign = align; X.lineJoin = 'round'; X.shadowColor = 'rgba(0,0,0,.8)'; X.shadowBlur = 20; X.shadowOffsetY = 4; X.strokeStyle = 'rgba(0,0,0,.6)'; X.lineWidth = 9; X.strokeText(s, x, y); X.shadowBlur = 0; X.shadowOffsetY = 0; X.fillStyle = col; X.fillText(s, x, y); }
const CX = 504; const fade = (t, a, b, fi = .2, fo = .2) => clamp((t - a) / fi) * (1 - clamp((t - b + fo) / fo));
function rich(parts, x, y, size, font) { X.font = `${size}px ${font}`; const tw = parts.reduce((a, [s]) => a + X.measureText(s).width, 0); let cx = x - tw / 2; for (const [s, c] of parts) { tx(s, cx, y, size, font, c, 'left', 14, 'rgba(0,0,0,.85)'); cx += X.measureText(s).width; } }
function timerStr(v) { v = Math.max(0, v); const s = Math.floor(v), ms = Math.floor((v - s) * 1000); return `0:${String(s).padStart(2, '0')}.${String(ms).padStart(3, '0')}`; }
function statBlock(t, a, b, big, line, src_) { const al = fade(t, a, b, .2, .25); if (al <= 0) return; X.globalAlpha = al; const p = lerp(.92, 1, eo(clamp((t - a) / .4)));
  X.save(); X.translate(CX, 470); X.scale(p, p); tx(big, 0, 0, 150, PF, '#ffffff', 'center', 30, 'rgba(95,210,255,.8)'); tx(line, 0, 70, 50, PFI, '#cfe6ff', 'center', 14, 'rgba(0,0,0,.9)'); if (src_) tx(src_, 0, 118, 28, MONO, 'rgba(200,214,240,.75)', 'center', 8, 'rgba(0,0,0,.9)'); X.restore(); X.globalAlpha = 1; }
function overlay(t) {
  X.clearRect(0, 0, W, H);
  const gr = X.createLinearGradient(0, 0, 0, 620); gr.addColorStop(0, 'rgba(2,3,10,.65)'); gr.addColorStop(1, 'rgba(2,3,10,0)'); X.fillStyle = gr; X.fillRect(0, 0, W, 620);
  // hook line (serif, one word in blue) — on screen from frame 1
  { const al = 1 - clamp((t - T.ts + .1) / .3); if (al > 0) { X.globalAlpha = al; rich([['What if the ', '#ffffff'], ['internet', '#5FD2FF']], CX, 250, 70, PF); rich([['disappeared for 5 seconds?', '#ffffff']], CX, 336, 62, PF); X.globalAlpha = 1; } }
  // the timer (mono), from frame 1: DISAPPEARS IN -> RETURNS IN (with slow-motion factor)
  { const before = t < T.ZERO, after = t >= T.ZERO && t < T.BACK + .6; if (before || after) { const al = t < T.BACK ? 1 : 1 - seg(t, T.BACK + .1, T.BACK + .6); X.globalAlpha = al;
      const lab = before ? 'INTERNET DISAPPEARS IN' : 'INTERNET RETURNS IN'; const v = before ? T.ZERO - t : 5 * (1 - seg(t, T.ZERO, T.BACK)); const col = before ? '#ffffff' : '#ff8a8a';
      tx(lab, 70, 700, 30, MONO, 'rgba(225,232,250,.9)', 'left', 8, 'rgba(0,0,0,.9)'); tx(timerStr(v), 66, 790, 92, MONO, col, 'left', 18, before ? 'rgba(95,210,255,.7)' : 'rgba(255,80,80,.7)');
      tx(before ? 'every phone on Earth depends on it' : `time slowed down ${((T.BACK - T.ZERO) / 5).toFixed(1)}×`, 70, 836, 26, MONO, 'rgba(200,214,240,.7)', 'left', 6, 'rgba(0,0,0,.9)'); X.globalAlpha = 1; } }
  // scene line
  { const al = fade(t, T.ts, T.data + .3); if (al > 0) { X.globalAlpha = al; tx('You’re in Times Square, New York.', CX, 1130, 50, PFI, '#e8eefc', 'center', 16, 'rgba(0,0,0,.9)'); X.globalAlpha = 1; } }
  // the zero moment
  { const al = fade(t, T.ZERO, T.g5 + .1, .05, .3); if (al > 0) { X.globalAlpha = al; tx('0:00.000', CX, 520, 130, MONO, '#ff5a5a', 'center', 40, 'rgba(255,60,60,.9)'); tx('the internet is gone', CX, 590, 46, PFI, '#ffd0d0', 'center', 14, 'rgba(0,0,0,.9)'); X.globalAlpha = 1; } }
  statBlock(t, T.g5, T.e6, '≈ 800,000', 'Google searches never happen', 'based on Google: 5 trillion+ searches / year');
  statBlock(t, T.e6, T.c7, '≈ 20,000,000', 'emails freeze in mid-air', 'based on ~376 billion emails / day (Radicati)');
  statBlock(t, T.c7, T.p8, '10,000s', 'card payments just hang', 'Visa alone: ~8,000–10,000 payments / second');
  { const al = fade(t, T.BACK, T.q10 + .1); if (al > 0) { X.globalAlpha = al; const p = back(clamp((t - T.BACK) / .4), 1.8); X.save(); X.translate(CX, 470); X.scale(p, p); tx('CONNECTED', 0, 0, 120, MONO, '#5FD2FF', 'center', 40, 'rgba(95,210,255,.95)'); X.restore(); X.globalAlpha = 1; } }
  if (t >= T.q10) { const a = eo(clamp((t - T.q10) / .4)); X.globalAlpha = a; rich([['What would ', '#ffffff'], ['you', '#5FD2FF'], [' miss first?', '#ffffff']], CX, 300, 80, PF); tx('comment below 👇', CX, 380, 46, `${PFI}, ${EMO}`, '#cfe6ff', 'center', 12, 'rgba(0,0,0,.9)'); X.globalAlpha = 1; }
  // captions (series style), hidden on the end card
  const c = t < T.q10 ? CAPS.find(c => t >= c.t0 && t < c.t1) : null;
  if (c) { const size = 76, y = 1300; X.font = `${size}px ${BX}`;
    const parts = c.w.map(([w, h]) => [w, h, X.measureText(w + ' ').width]); const tw = parts.reduce((a, p) => a + p[2], 0) - X.measureText(' ').width;
    const pop = lerp(.9, 1, back(clamp((t - c.t0) / .12), 2)); const sc = Math.min(1, 860 / tw); X.save(); X.translate(CX, y); X.scale(pop * sc, pop * sc);
    let x = -tw / 2; for (const [w, h, ww] of parts) { stroked(w, x, 0, size, BX, h ? CSS.yel : '#fff', 'left'); x += ww; } X.restore(); }
}

// ---------------- boot ----------------
async function boot() {
  for (const [n, u] of FONTS) { const f = new FontFace(n, `url(${u})`); await f.load(); document.fonts.add(f); }
  [F, CAPS] = await Promise.all(['film.json', 'caps.json'].map(u => fetch(u).then(r => r.json())));
  timeline(); buildCity();
  window.DUR = F.dur; window.EV = EV; window.T = T; window.SH = SH; window.DBG = { camera, scene, ST, grade, bloom };
  window.render = t => { frame(t); composer.render(); overlay(t); };
  window.render(0.5); window.READY = true;
}
boot();
</script></body></html>
