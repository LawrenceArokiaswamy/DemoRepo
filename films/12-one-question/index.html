  const tt = canvasTex(2048, 1024, (cx, w, h) => { cx.fillStyle = '#000'; cx.fillRect(0, 0, w, h); cx.font = `34px ${BB}`; cx.textBaseline = 'top'; for (let y = 0; y < h; y += 42) { let x = -r() * 200; while (x < w) { const wd = words[Math.floor(r() * words.length)] + ' '; const ww = cx.measureText(wd).width; cx.fillStyle = `rgba(255,${190 + 60 * r() | 0},${90 + 80 * r() | 0},${.45 + .55 * r()})`; cx.fillText(wd, x, y); x += ww; } } });

    vertexShader: `varying vec2 vUv; varying float vH; varying float vZ; float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
      float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f); return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
      float fbm(vec2 p){ float a = 0., s = .5; for (int i = 0; i < 5; i++){ a += s * n2(p); p *= 2.03; s *= .5; } return a; }
      void main(){ vUv = uv; vec3 p = position; float e = fbm(uv * 6.); e = pow(e, 2.2) * 9.; float ridge = 1. - abs(n2(uv * 9.) * 2. - 1.); e += ridge * ridge * 1.2; p.z = e; vH = e;
        vec4 mv = modelViewMatrix * vec4(p,1.); vZ = -mv.z; gl_Position = projectionMatrix * mv; }`,

      void main(){ vec3 t = texture2D(uTex, vUv * vec2(5., 10.) + vec2(0., uT * .01)).rgb; float k = smoothstep(.3, 3.5, vH);

        c = mix(vec3(.10,.07,.16), c, exp(-vZ * .05)) * uGain; gl_FragColor = vec4(c, 1.); }` }));

  // answer words in the data centre (n13: the first three slowly; the rest finish fast at the start of n16)
  const a = word('n13', 'one'), b = word('n13', 'guessing');
  T.pick = [a + .05, lerp(a, b, .45), b - .05];
  for (let i = 3; i < REPLY.length; i++) T.pick.push(T.back0 + .02 + (i - 3) * .07);
  // reply words on the phone, in sync with the voice reading them
  const rw = F.words.n17.map(x => x[1]); T.reply = [rw[0], rw[1], rw[1] + .22, rw[2], rw[3], rw[4], rw[5], rw[6]];
  // sound events for the mixer (exported by events.mjs)

  ev.push({ t: T.building + .9, type: 'zap' });

  T.pick.forEach((t, i) => ev.push({ t, type: i < 3 ? 'pick' : 'tick', g: i < 3 ? .8 : .5 }));
  ev.push({ t: T.tw - .05, type: 'whoosh', g: .6 }); [0, 1, 2].forEach(i => ev.push({ t: T.tw + .5 + i * .12, type: 'bar', g: .6 }));

  [0, .3, .62, .95, 1.3].forEach((k, i) => ev.push({ t: lerp(T.ret0, T.ret1, k / 1.6), type: 'rush', g: 1 - i * .08 }));

// illustrative clock (ms since SEND): stages, not measurements
function msAt(t) {
  if (t < T.send) return 0;
  const K = [[T.send, 0], [T.brain, 3], [T.fire, 6], [T.tower, 9], [T.building, 30], [T.chop, 45], [T.writes, 180], [T.learned, 600], [T.back0, 1300], [T.ret1, 1500], [T.stop - .1, 1900]];
  for (let i = 0; i < K.length - 1; i++) if (t < K[i + 1][0]) return lerp(K[i][1], K[i + 1][1], (t - K[i][0]) / (K[i + 1][0] - K[i][0]));
  return 1900;
}

// --- the thumb: tip glides key to key and dips on every tap

  let px, py, dip = 0;
  if (t <= targets[0][0]) { const k = eo(seg(t, targets[0][0] - .45, targets[0][0])); [px, py] = [lerp(SW + 200, targets[0][1][0], k), lerp(SH_ + 300, targets[0][1][1], k)]; }

    let x = -tw / 2; for (const [w, h, ww] of parts) { stroked(w, x, 0, size, BX, h ? CSS.yel : '#fff', 'left'); x += ww; }
    X.restore();
  }
}

    for (const ch of QUESTION) { const w = m.measureText(ch).width; if (ch !== ' ') { const L = label3d(ch, { size: 120, font: BB, color: '#fff', glow: 'rgba(120,200,255,.8)', h: .04, mult: .95, pad: 16 }); L.visible = false; inner.add(L); letters.push({ m: L, p: s2l(x + w / 2, 420 + 75) }); } x += w; } }
  window.DUR = F.dur; window.EV = EV; window.T = T; window.DBG = { bits: () => bits, fallBits: () => fallBits, camera, phone, grade, bloom, scene };
  window.render = t => { frame(t); composer.render(); overlay(t); };

}
