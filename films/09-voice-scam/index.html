<html><head><meta charset="utf-8"><title>voice-scam</title>
<style>html,body{margin:0;background:#0B0C0E;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// "Your mom gets a call. It's your voice. It isn't you." Forensic reconstruction of one cloned-voice scam call.
// Everything is a pure function of t (30 fps, 1080x1920). Timing lives in film.json / caps.json / env.json / beats.json.
const cv = document.getElementById('c'), X = cv.getContext('2d');
const W = cv.width = innerWidth, H = cv.height = innerHeight;
const S = document.createElement('canvas'); S.width = W; S.height = H; const c = S.getContext('2d');
const G = '#0B0C0E', PANEL = '#141619', HAIR = '#2E3238', TXT = '#ECEAE4', SEC = '#8B9097', TICK = '#4A4F57', RED = '#FF4A2E', PAPER = '#E4E0D4', INK = '#1D1D1B';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, x) => a + (b - a) * x, seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - clamp(x), 3), eio = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), eo5 = x => 1 - Math.pow(1 - clamp(x), 5);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
let F, ENV, CAPS, BEATS, SHOTS, CH;
const MONO = 'IBM Plex Mono', MONOB = 'PlexB', AN = 'Anton', AR = 'Archivo';

async function boot() {
  const fonts = [[AN, 'fonts/Anton-Regular.ttf'], [AR, 'fonts/ArchivoBlack-Regular.ttf'], [MONO, 'fonts/IBMPlexMono-Medium.ttf'], [MONOB, 'fonts/IBMPlexMono-Bold.ttf']];
  for (const [n, u] of fonts) { const f = new FontFace(n, `url(${u})`); await f.load(); document.fonts.add(f); }
  [F, ENV, CAPS, BEATS] = await Promise.all(['film.json', 'env.json', 'caps.json', 'beats.json'].map(u => fetch(u).then(r => r.json())));
  SHOTS = F.shots.map(([id, t0], i) => ({ id, t0, t1: i + 1 < F.shots.length ? F.shots[i + 1][1] : F.dur }));
  CH = chunks(CAPS);
  window.DUR = F.dur;
  window.READY = true;

// ---------- data helpers ----------
function envAt(src, t) { const e = ENV[src], x = t * 60, i = Math.floor(x); if (i < 0 || i + 1 >= e.length) return 0; return lerp(e[i], e[i + 1], x - i); }
function pulse(t, tau = .16) { let last = -9; for (const b of BEATS) { if (b <= t) last = b; else break; } return Math.exp(-(t - last) / tau); }
function chunks(caps) {
  const out = []; let cur = [];
  caps.forEach((w, i) => {
    cur.push(w); const nx = caps[i + 1];
    if (!nx || /[.,?!]$/.test(w.w) || w.end || cur.length >= 3 || nx.line !== w.line || nx.t0 - w.t1 > .3) { out.push(cur); cur = []; }
  });
  out.forEach((ch, i) => { const nx = out[i + 1]; ch.a = ch[0].t0 - .04; ch.b = Math.min(nx ? nx[0].t0 - .02 : 99, ch[ch.length - 1].t1 + .45); });
  return out;
}
// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function txt(s, x, y, size, font, col, align = 'left', base = 'alphabetic') { c.font = `${size}px ${font}`; c.fillStyle = col; c.textAlign = align; c.textBaseline = base; c.fillText(s, x, y); }
function tw(s, size, font) { c.font = `${size}px ${font}`; return c.measureText(s).width; }
function tag(s, x, y, col = SEC) { c.fillStyle = RED; c.fillRect(x, y - 24, 10, 24); txt(s, x + 22, y, 30, MONO, col); }
function panel(x, y, w, h, fill = PANEL) { c.fillStyle = fill; c.fillRect(x, y, w, h); c.strokeStyle = HAIR; c.lineWidth = 2; c.strokeRect(x + 1, y + 1, w - 2, h - 2); }
function circleDraw(x, y, r, p, lw = 6, col = RED) { if (p <= 0) return; c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.beginPath(); c.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eo(p)); c.stroke(); }
function ellipseDraw(x, y, rx, ry, p, lw = 6) { if (p <= 0) return; c.strokeStyle = RED; c.lineWidth = lw; c.lineCap = 'round'; c.beginPath(); c.ellipse(x, y, rx, ry, -.06, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2.05 * eo(p)); c.stroke(); }
function stamp(s, x, y, size, t, t0, col = RED, font = AN, align = 'center') { // cut-in with a short slam
  if (t < t0) return; const p = seg(t, t0, t0 + .1), sc = lerp(1.18, 1, eo5(p));
  c.save(); c.translate(x, y); c.scale(sc, sc); c.globalAlpha = clamp(p * 3); txt(s, 0, 0, size, font, col, align, 'middle'); c.restore();
}
function hilite(x, y, w, h, p) { if (p <= 0) return; c.save(); c.globalCompositeOperation = 'screen'; c.fillStyle = 'rgba(255,74,46,.85)'; c.fillRect(x, y, w * eo(p), h); c.restore(); }
function strike(x, y, w, p, lw = 12) { if (p <= 0) return; c.strokeStyle = RED; c.lineWidth = lw; c.lineCap = 'round'; c.beginPath(); c.moveTo(x, y); c.lineTo(x + w * eo(p), y - 8 * eo(p)); c.stroke(); }
function dashLine(x0, y0, x1, y1, p) { if (p <= 0) return; c.save(); c.setLineDash([18, 12]); c.strokeStyle = RED; c.lineWidth = 4; c.beginPath(); c.moveTo(x0, y0); c.lineTo(lerp(x0, x1, eo(p)), lerp(y0, y1, eo(p))); c.stroke(); c.restore(); }
function check(x, y, s, p) { if (p <= 0) return; c.fillStyle = RED; c.fillRect(x, y, s, s); c.strokeStyle = '#fff'; c.lineWidth = s * .13; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath();
  const q = eo(p), a = [x + s * .22, y + s * .52], b = [x + s * .42, y + s * .72], d = [x + s * .78, y + s * .3];
  c.moveTo(...a); if (q < .4) c.lineTo(lerp(a[0], b[0], q / .4), lerp(a[1], b[1], q / .4)); else { c.lineTo(...b); c.lineTo(lerp(b[0], d[0], (q - .4) / .6), lerp(b[1], d[1], (q - .4) / .6)); } c.stroke(); }
// live waveform: bars from the real voice envelope. t0..t1 = time span shown across w; playT = red play-line time
function wave(src, x, y, w, h, t0, t1, opt = {}) {
  const bw = opt.bw || 10, gap = opt.gap || 6, n = Math.floor(w / (bw + gap)), playT = opt.playT ?? 1e9;
  for (let i = 0; i < n; i++) {
    const ti = lerp(t0, t1, (i + .5) / n); let a = envAt(src, ti); a = Math.pow(a, .7) * (opt.gain || 1);
    const bh = Math.max(4, a * h); const past = ti <= playT;
    c.fillStyle = opt.col ? opt.col : (past ? (opt.pastCol || TXT) : TICK);
    c.fillRect(x + i * (bw + gap), y - bh / 2, bw, bh);
  }
  if (opt.playLine) { const px = x + w * clamp((playT - t0) / (t1 - t0)); c.fillStyle = RED; c.fillRect(px - 3, y - h * .62, 6, h * 1.24); }
}
// a synthetic waveform for things that are not real audio (the social clip sample)
function fakeWave(x, y, w, h, seed, col, bw = 8, gap = 5) { const n = Math.floor(w / (bw + gap)); c.fillStyle = col;
  for (let i = 0; i < n; i++) { const a = .15 + .85 * Math.abs(Math.sin(i * .37 + seed) * Math.sin(i * .11 + seed * 2.1)) * (.6 + .4 * hash(i + seed)); c.fillRect(x + i * (bw + gap), y - a * h / 2, bw, a * h); } }
function handset(x, y, r, rot, col) { c.save(); c.translate(x, y); c.rotate(rot); c.strokeStyle = col; c.lineCap = 'round'; c.lineWidth = r * .32; c.beginPath(); c.arc(0, r * .55, r * .78, Math.PI * 1.18, Math.PI * 1.82); c.stroke();
  c.fillStyle = col; for (const s of [-1, 1]) { c.save(); c.translate(s * r * .62, r * .02); c.rotate(s * .5); rr(-r * .2, -r * .14, r * .4, r * .36, r * .1); c.fill(); c.restore(); } c.restore(); }
function person(x, y, r, col = TICK, bg = HAIR) { // anonymous silhouette avatar (original, generic)
  c.save(); c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = bg; c.fill(); c.clip();
  c.fillStyle = col; c.beginPath(); c.arc(x, y - r * .18, r * .36, 0, Math.PI * 2); c.fill(); c.beginPath(); c.ellipse(x, y + r * .78, r * .66, r * .52, 0, 0, Math.PI * 2); c.fill(); c.restore(); }
// the phone. mode 'ring' | 'call'
function phone(cx, cy, s, t, o) {
  c.save(); c.translate(cx, cy); c.scale(s, s);
  const w = 560, h = 1120; c.shadowColor = 'rgba(255,74,46,' + (o.glow || 0) + ')'; c.shadowBlur = 80;
  rr(-w / 2, -h / 2, w, h, 70); c.fillStyle = '#17191d'; c.fill(); c.shadowBlur = 0; c.lineWidth = 5; c.strokeStyle = '#3a3f46'; c.stroke();
  rr(-w / 2 + 18, -h / 2 + 18, w - 36, h - 36, 54); const gr = c.createLinearGradient(0, -h / 2, 0, h / 2); gr.addColorStop(0, '#1d2025'); gr.addColorStop(1, '#0d0e10'); c.fillStyle = gr; c.fill();
  rr(-60, -h / 2 + 34, 120, 30, 15); c.fillStyle = '#000'; c.fill();
  txt('21:47', -w / 2 + 70, -h / 2 + 62, 28, MONO, SEC);
  if (o.mode === 'ring') {
    for (let k = 0; k < 3; k++) { const q = ((t * 1.4 + k / 3) % 1); c.strokeStyle = `rgba(255,74,46,${(1 - q) * .8})`; c.lineWidth = 6; c.beginPath(); c.arc(0, -250, 120 + q * 170, 0, Math.PI * 2); c.stroke(); }
    person(0, -250, 120); txt(o.name, 0, -50, 120, AR, TXT, 'center'); txt(o.sub || 'mobile', 0, 6, 34, MONO, SEC, 'center');
    txt('incoming call', 0, 120, 36, MONO, TXT, 'center');
    c.beginPath(); c.arc(-140, 370, 70, 0, Math.PI * 2); c.fillStyle = RED; c.fill(); handset(-140, 368, 46, Math.PI * .75, '#fff');
    const sw = o.swipe || 0; c.beginPath(); c.arc(140, 370 - sw * 40, 70, 0, Math.PI * 2); c.fillStyle = '#ECEAE4'; c.fill(); handset(140, 366 - sw * 40, 46, 0, '#111');
  } else {
    person(0, -330, 80); txt(o.name, 0, -190, 92, AR, TXT, 'center');
    const ct = Math.max(0, t - .4); txt(`00:${String(Math.floor(ct)).padStart(2, '0')}`, 0, -130, 40, MONO, RED, 'center');
    wave('scam', -230, 90, 460, 330, t - 2.2, t, { bw: 9, gap: 6, pastCol: TXT, gain: 1.1 });
    c.fillStyle = RED; c.fillRect(226, -75, 6, 330);
    if (!o.noBtn) { c.beginPath(); c.arc(0, 400, 70, 0, Math.PI * 2); c.fillStyle = RED; c.fill(); handset(0, 398, 46, Math.PI * .75, '#fff'); }

}
function bgGrid(t, glow) {
  c.fillStyle = G; c.fillRect(-400, -400, W + 800, H + 800);
  c.strokeStyle = '#121418'; c.lineWidth = 2; c.beginPath();
  for (let x = -360; x < W + 400; x += 90) { c.moveTo(x, -400); c.lineTo(x, H + 400); }
  for (let y = -360; y < H + 400; y += 90) { c.moveTo(-400, y); c.lineTo(W + 400, y); } c.stroke();
  if (glow > 0) { const g = c.createRadialGradient(W / 2, H * .42, 50, W / 2, H * .42, H * .7); g.addColorStop(0, `rgba(255,74,46,${.22 * glow})`); g.addColorStop(1, 'rgba(255,74,46,0)'); c.fillStyle = g; c.fillRect(-400, -400, W + 800, H + 800); }
}
// ---------- shots: each draws in world space (1080x1920). lt = local time, d = shot length, t = film time ----------
const TRANSCRIPT = [['00:00.4', 'Mom? It\'s me…'], ['00:01.4', 'I\'m in trouble.'], ['00:02.0', 'I need money. ', 'Right now!']];
const SH = {
  A1(t, lt) { // the hook: mom's phone ringing, SAM calling

    txt('YOUR MOM', 540, 250, 150, AN, RED, 'center'); txt('GETS THIS CALL.', 540, 400, 124, AN, TXT, 'center');
    const sw = eo(seg(t, .28, .42));
    if (ring) phone(540 + shake, 950, .76, t, { mode: 'ring', name: 'SAM', sub: 'mobile ♥', swipe: sw, glow: .5 });
    else { phone(540, 950, .76, t, { mode: 'call', noBtn: true, name: 'SAM', glow: .25 + .35 * envAt('scam', t) }); }
  },
  A2(t, lt) { phone(540, 760, 1.45, t, { mode: 'call', noBtn: true, name: 'SAM', glow: .4 * envAt('scam', t) }); },
  A3(t, lt) { // extreme close on the voice itself
    wave('scam', 30, 820, 1020, 900, t - 1.6, t + .0, { bw: 14, gap: 8, pastCol: TXT, gain: 1.15 }); c.fillStyle = RED; c.fillRect(1040, 360, 8, 920);
    tag('CALLER · "SAM"', 70, 220, TXT);
  },
  B1(t, lt) { // hard cut: caller ID struck through
    tag('CALLER ID', 90, 330); txt('SAM', 90, 640, 300, AN, TXT); strike(70, 520, 600, seg(t, 3.66, 3.86), 22);
    wave('scam', 90, 940, 900, 260, .45, 3.25, { bw: 10, gap: 5, col: TICK });
    stamp('NOT SAM.', 540, 1180, 120, t, 3.72, RED);
  },
  B2(t, lt) {
    tag('VOICE ANALYSIS', 90, 330); wave('scam', 90, 620, 900, 380, .45, 3.25, { bw: 10, gap: 5, col: RED });
    stamp('AI CLONE', 540, 1000, 230, t, 4.3, TXT); txt('SYNTHETIC VOICE', 540, 1150, 44, MONOB, RED, 'center');
  },
  C1(t, lt) { // 3 seconds of audio: bracket + stopwatch

    c.strokeStyle = RED; c.lineWidth = 6; c.strokeRect(bx, 940, bw, 240); txt('00:00 → 00:03', bx, 1230, 32, MONO, RED);

  C2(t, lt) { // 85% match meter
    tag('McAFEE STUDY · 2023', 90, 300);
    const p = eo(seg(t, 6.45, 7.05)); txt(`${Math.round(85 * p)}%`, 540, 740, 380, AN, TXT, 'center'); txt('VOICE MATCH', 540, 860, 70, AN, RED, 'center');

    txt('ORIGINAL', 90, 1120, 30, MONO, SEC); fakeWave(250, 1110, 740, 70, 1.3, TXT, 7, 5);
    txt('CLONE', 90, 1220, 30, MONO, RED); fakeWave(250, 1210, 740 * eo(seg(t, 6.5, 7.1)), 70, 1.36, RED, 7, 5);

    tag('RED FLAGS', 90, 330);

      if (t < t0) continue; check(90, y - 105, 130, seg(t, t0 + .05, t0 + .3)); stamp(s, 260, y - 40, 200, t, t0, TXT, AN, 'left'); }
