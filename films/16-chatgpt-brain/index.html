function sGlobe(u, t) { show('globe'); globeLight(t, T.g0 + .1, T.ex0 - .1); SETS.globe.rotation.y = t * .25;
  cam(V(0, lerp(1.9, 1.6, u), lerp(-21.6, -23.2, eio(u))), V(0, 1.4, -30), 44, lerp(-.03, .03, u)); ST.flash = cutF(.2); }
function sExams(u, t) { show('exams'); SETS.exams.userData.cards.forEach((c, i) => { const st = T.ex0 + .08 + i * .035; const k = back(seg(t, st, st + .25), 1.8); c.scale.setScalar(Math.max(.001, k)); });
  const sp = seg(t, T.special, T.same0); ST.desat = .55 * sp;
  cam(V(lerp(-.3, .3, u), lerp(1.7, 1.5, u), lerp(-39.6, -40.6, eio(u))), V(0, 1.55, -44), 44, lerp(-.03, .02, u)); ST.flash = cutF(); }
function minis(t, conv, gold = 0) { SETS.field.userData.minis.forEach(m => { const target = (gold > 0 && m.cx === 0 && m.cy === 0) ? new THREE.Color(1.3, .9, .35) : new THREE.Color(.35, .85, 1.1);
  const k = (gold > 0 && m.cx === 0 && m.cy === 0) ? gold : clamp(conv * 1.4 - hash(m.i * 2.3) * .4); m.b.material.uniforms.uTint.value.copy(m.start).lerp(target, k); m.b.rotation.y = .4 + t * .3 + (1 - conv) * m.i; }); }
function sSame(u, t) { show('field'); minis(t, ss(seg(t, T.same - .3, T.q0 + .2)));
  cam(V(lerp(-.4, .2, u), lerp(1.8, 1.6, u), lerp(-54.2, -55.2, u)), V(0, 1.55, -60), 46, lerp(-.02, .02, u)); ST.flash = cutF(); }
function sQuestion(u, t) { show('field'); minis(t, 1); const k = seg(t, T.q0, T.S0); SETS.field.userData.minis.forEach(m => m.b.material.uniforms.uOpacity.value = lerp(1, .55, k));
  cam(V(0, 1.6, lerp(-55.2, -56.6, ei(k))), V(0, 1.6, -60), 46, 0); ST.desat = t >= T.S0 ? .7 : .3 * k; ST.flash = cutF(); }
function sPayoff(u, t) { show('field'); const g = eo(seg(t, T.HIT, T.HIT + .5)); minis(t, 1, g); const M = SETS.field.userData.minis; M.forEach(m => { const c = m.cx === 0 && m.cy === 0; m.b.material.uniforms.uOpacity.value = c ? 1.4 : .45; m.b.scale.setScalar(c ? 1 + .5 * g : 1); });
  const q = SETS.field.userData.q; q.visible = t > T.qs; q.scale.setScalar(back(seg(t, T.qs, T.qs + .35), 2) + .001); faceCam(q);
  cam(V(lerp(0, .1, u), lerp(1.55, 1.6, u), lerp(-56.4, -57.2, eio(u))), V(0, 1.55, -60), 44, 0); ST.flash = Math.max(.7 * (1 - eo(seg(t, T.HIT, T.HIT + .15))), cutF()); ST.flashCol = [1.5, 1.2, .7]; }
function sCta(u, t) { show('brain'); brainSpin(t, .2); chipAt(t); brainColour(t, 1, .35 + .15 * Math.sin(t * 3)); sparksUpdate(t, 1.6, .5);
  cam(V(lerp(5.0, 5.6, u), lerp(1.7, 1.6, u), lerp(.6, -.4, u)), V(0, 1.45, 0), 44, lerp(.02, -.02, u)); ST.flash = cutF(); }

let CUR = { t: 0, t0: 0 }; const cutF = (k = .14) => k * (1 - eo(clamp((CUR.t - CUR.t0) / .12)));
function frame(t) {
  resetFrame();
  for (const k in SETS) if (SETS[k].visible !== false) SETS[k].traverse(o => { if (o.material && o.material.uniforms && o.material.uniforms.uTime) o.material.uniforms.uTime.value = t; });
  let s = SH.find(x => t >= x.t0 && t < x.t1) || SH[SH.length - 1]; ST.shot = s.name; CUR = { t, t0: s.t0 };
  s.fn(clamp((t - s.t0) / (s.t1 - s.t0)), t, s);
  grade.uniforms.uFlash.value = clamp(ST.flash * .22); grade.uniforms.uFlashCol.value.setRGB(...ST.flashCol); grade.uniforms.uDesat.value = ST.desat; grade.uniforms.uCA.value = ST.ca; grade.uniforms.uStreak.value = ST.streak;
}

// ---------------- 2D overlay ----------------
function tx(s, x, y, size, font, col, align = 'left', glow = 0, glowCol = null) { X.font = `${size}px ${font}`; X.textAlign = align; X.textBaseline = 'alphabetic'; if (glow) { X.shadowColor = glowCol || col; X.shadowBlur = glow; } X.fillStyle = col; X.fillText(s, x, y); X.shadowBlur = 0; }
function fitTx(s, x, y, size, font, col, maxW, glow, glowCol) { X.font = `${size}px ${font}`; const w = X.measureText(s).width; const sz = w > maxW ? size * maxW / w : size; tx(s, x, y, sz, font, col, 'center', glow, glowCol); }
function stroked(s, x, y, size, font, col, align = 'center') { X.font = `${size}px ${font}`; X.textAlign = align; X.lineJoin = 'round'; X.shadowColor = 'rgba(0,0,0,.8)'; X.shadowBlur = 20; X.shadowOffsetY = 4; X.strokeStyle = 'rgba(0,0,0,.6)'; X.lineWidth = 9; X.strokeText(s, x, y); X.shadowBlur = 0; X.shadowOffsetY = 0; X.fillStyle = col; X.fillText(s, x, y); }
const CX = 504, GLOW = 'rgba(255,170,30,.85)', SRC = 'rgba(210,222,250,.92)', CGLOW = 'rgba(60,200,255,.9)', VGL = 'rgba(150,100,255,.9)';
const fade = (t, a, b, fi = .15, fo = .15) => clamp((t - a) / fi) * (1 - clamp((t - b + fo) / fo));
function head(lines, t, a, b, y0 = 205, size = 92, step = 104) {
  let y = y0; lines.forEach((L, i) => { const [s, at, col, sz0, gl] = L; const sz = sz0 || size, nz = lines[i + 1] ? (lines[i + 1][3] || size) : size;
    const kick = sz < size ? (size - sz) * step / size : 0; const al = fade(t, at, b, .12) * (a <= t ? 1 : 0);
    if (al > 0) { X.globalAlpha = al; const pop = back(clamp((t - at) / .3), 1.6); X.save(); X.translate(CX, y - kick); X.scale(lerp(.8, 1, pop), lerp(.8, 1, pop)); fitTx(s, 0, 0, sz, AN, col || CSS.gold, 860, 26, gl || GLOW); X.restore(); X.globalAlpha = 1; }
    y += (kick ? sz : Math.max(sz, nz)) * step / size; });
}
function src(s, y, t, a, b) { const al = fade(t, a, b); if (al > 0) { X.globalAlpha = al; X.font = `32px ${BS}`; const w = X.measureText(s).width; rr(X, CX - w / 2 - 18, y - 32, w + 36, 44, 22); X.fillStyle = 'rgba(4,8,26,.62)'; X.fill(); tx(s, CX, y, 32, BS, SRC, 'center', 8, 'rgba(0,0,0,.9)'); X.globalAlpha = 1; } }
function bigNum(s, y, t, a, b, size = 230, col = CSS.gold2, x = CX, gl = GLOW) { const al = fade(t, a, b, .1); if (al > 0) { X.globalAlpha = al; const nb = back(clamp((t - a) / .35), 1.8); X.save(); X.translate(x, y); X.scale(nb, nb); tx(s, 0, 0, size, AN, col, 'center', 44, gl); X.restore(); X.globalAlpha = 1; } }
function overlay(t) {
  X.clearRect(0, 0, W, H);
  { const b = T.h1 + .02; const al = 1 - clamp((t - b + .15) / .15); if (al > 0) { X.globalAlpha = al; const pop = lerp(.94, 1, eo(clamp(t / .5))); X.save(); X.translate(CX, 220); X.scale(pop, pop);
      fitTx('WHAT IF CHATGPT', 0, 0, 100, AN, CSS.gold, 880, 26, GLOW); fitTx('WAS IN YOUR BRAIN?', 0, 120, 112, AN, CSS.gold2, 900, 34, GLOW); X.restore(); X.globalAlpha = 1; } }
  head([['NOT PURE SCI-FI', T.h1, CSS.cyan, 64, CGLOW], ['BRAIN CHIPS ARE REAL', T.h1 + .05]], t, T.h1, T.r0 + .02, 205);
  src('dozens of trial patients control computers by thought (Neuralink, 2026)', 420, t, T.h1 + .4, T.r0 + .02);
  head([['EVERY LANGUAGE', T.lang, CSS.cyan, 92, CGLOW]], t, T.lang, T.exam + .02, 205);
  head([['EVERY EXAM', T.exam], ['EVERY FACT', word('n3', 'fact') - .1, CSS.gold2], ['INSTANTLY', T.inst3, '#ffffff', 120, CGLOW]], t, T.exam, T.drop + .02, 205);
  head([['THE SMARTEST PERSON', T.drop, CSS.gold2, 100], ['IN HISTORY', word('n4', 'history') - .1, CSS.gold, 140]], t, T.drop, T.tw0 + .02, 220);
  head([['UNTIL THE TWIST…', T.tw0 + .1, '#e6eefc', 100, VGL]], t, T.tw0 + .1, T.f0 + .02, 220);
  if (t > T.f0 && t < T.f1 + .02) { const a1 = T.f0 + .4; head([['YOUR SENSES', a1, CSS.cyan, 64, CGLOW]], t, a1, T.f1 + .02, 205); bigNum('1,000,000,000', 330, t, a1 + .1, T.f1 + .02, 120, '#bfefff', CX, CGLOW);
    if (t > T.ten) { head([['YOUR THOUGHTS', T.ten, CSS.gold, 64]], t, T.ten, T.f1 + .02, 1470); bigNum('10', 1620, t, T.ten + .05, T.f1 + .02, 160, CSS.gold2, CX + 230); tx('bits / second', CX + 230, 1675, 44, BX, '#ffe6a8', 'center', 10, GLOW); }
    src('Zheng & Meister, Caltech, Neuron (Dec 2024)', 400, t, a1 + .3, T.f1 + .02); }
  if (t > T.modem && t < T.f1 + .02) src('an old 56k dial-up modem: 56,000 bits / second', 460, t, T.modem + .1, T.f1 + .02);
  head([['IT KNOWS EVERYTHING…', T.f1, CSS.cyan, 92, CGLOW], ['YOU THINK 1 THOUGHT', T.one - .05, CSS.gold2], ['AT A TIME', T.one + .3, CSS.gold2]], t, T.f1, T.g0 + .02, 205);
  head([['NOW GIVE IT', T.g0 + .05, CSS.gold], ['TO EVERYONE', word('n8', 'everyone') - .1, CSS.gold2, 140]], t, T.g0 + .05, T.ex0 + .02, 220);
  if (t > T.ex0 && t < T.same0 + .02) { const a = fade(t, T.ex0, T.same0 + .02); const gr = X.createLinearGradient(0, 0, 0, 460); gr.addColorStop(0, `rgba(3,5,14,${.95 * a})`); gr.addColorStop(.75, `rgba(3,5,14,${.85 * a})`); gr.addColorStop(1, 'rgba(3,5,14,0)'); X.fillStyle = gr; X.fillRect(0, 0, W, 460); }
  head([['EVERYONE SCORES 100', T.ex0 + .1, CSS.gold2]], t, T.ex0 + .1, T.same0 + .02, 205); head([['KNOWING STOPS BEING SPECIAL', T.special, '#e6eefc', 64, CGLOW]], t, T.special, T.same0 + .02, 320);
  head([['SAME AI…', T.same0 + .1, CSS.cyan, 92, CGLOW], ['SAME THOUGHTS?', T.same, '#ffffff', 120, CGLOW]], t, T.same0 + .1, T.q0 + .02, 205);
  src('AI help made people’s stories more alike (Doshi & Hauser, Science Advances, 2024)', 450, t, T.same + .3, T.q0 + .02);
  head([['SO WHAT MAKES', T.q0], ['YOU SPECIAL?', word('n11', 'you') - .05, CSS.gold2, 140]], t, T.q0, T.HIT, 220);
  head([['NOT THE ANSWERS.', T.HIT, '#e6eefc', 92, CGLOW]], t, T.HIT, T.c0 + .02, 205); head([['YOUR QUESTIONS.', T.qs, CSS.gold2, 130]], t, T.qs, T.c0 + .02, 330);
  if (t >= T.c0) { const a = eo(clamp((t - T.c0) / .3)); X.globalAlpha = a; const p = lerp(.9, 1, back(clamp((t - T.c0) / .4), 1.6)); X.save(); X.translate(CX, 230); X.scale(p, p);
      fitTx('WOULD YOU', 0, 0, 120, AN, CSS.gold, 880, 30, GLOW); fitTx('INSTALL IT?', 0, 140, 150, AN, CSS.gold2, 900, 40, GLOW); X.restore();
    if (t > T.yes) { const b = back(clamp((t - T.yes) / .35), 2); for (const [lab, x, col, gl] of [['YES', CX - 200, '#3ee08a', 'rgba(40,220,120,.9)'], ['NO', CX + 200, '#ff5a5a', 'rgba(255,70,70,.9)']]) {
        const pul = 1 + .05 * Math.sin(t * 6 + x); X.save(); X.translate(x, 1060); X.scale(b * pul, b * pul); rr(X, -150, -80, 300, 120, 60); X.fillStyle = 'rgba(6,10,28,.85)'; X.fill(); X.lineWidth = 6; X.strokeStyle = col; X.stroke(); tx(lab, 0, 10, 84, AN, col, 'center', 24, gl); X.restore(); }
      tx('tell me in the comments 👇', CX, 1170, 52, BX, '#ffffff', 'center', 12, CGLOW); }
    X.globalAlpha = 1; }
  // captions (hidden on the end card, where the question is the text)
  const c = t < T.c0 ? CAPS.find(c => t >= c.t0 && t < c.t1) : null;
  if (c) { const size = 84, y = 1300; X.font = `${size}px ${BX}`;
    const parts = c.w.map(([w, h]) => [w, h, X.measureText(w + ' ').width]); const tw = parts.reduce((a, p) => a + p[2], 0) - X.measureText(' ').width;
    const pop = lerp(.9, 1, back(clamp((t - c.t0) / .12), 2)); const sc = Math.min(1, 860 / tw); X.save(); X.translate(CX, y); X.scale(pop * sc, pop * sc);
    let x = -tw / 2; for (const [w, h, ww] of parts) { stroked(w, x, 0, size, BX, h ? CSS.yel : '#fff', 'left'); x += ww; } X.restore(); }
}

// ---------------- boot ----------------
async function boot() {
  for (const [n, u] of FONTS) { const f = new FontFace(n, `url(${u})`); await f.load(); document.fonts.add(f); }
  [F, CAPS] = await Promise.all(['film.json', 'caps.json'].map(u => fetch(u).then(r => r.json())));
  timeline(); buildBrain(); buildFunnel(); buildGlobe(); buildExams(); buildField();
  window.DUR = F.dur; window.EV = EV; window.T = T; window.SH = SH; window.DBG = { camera, scene, ST, grade, bloom };
  window.render = t => { frame(t); composer.render(); overlay(t); };
  window.render(0.5); window.READY = true;
}
boot();
