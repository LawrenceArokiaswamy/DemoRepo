const A = figure(), B = figure({ bun: true });    // A: him (left), B: her (right) — the "I" of the captions
// bench halves

// camera keys: [t, pos, look, fov, cut?]
const CK = [

  [8.0, V(0, 1.6, 7.6), V(0, .75, 0), 36, 1], [14, V(0, 2.1, 10.2), V(0, .7, 0), 40], [21.5, V(0, 3.0, 13.4), V(0, .55, 0), 42],

  [27.4, V(4.5, 1.25, 3.7), V(3.78, .85, 0), 30, 1], [30.9, V(4.4, 1.32, 3.4), V(3.78, .95, 0), 30],
  [31.0, V(5.3, 1.45, 2.6), V(-3.78, .75, 0), 22, 1], [33.0, V(5.1, 1.45, 2.7), V(-3.78, .75, 0), 20],

  [37.3, V(-3.0, 1.2, 3.6), V(-3.78, .78, 0), 30, 1], [38.4, V(-2.95, 1.22, 3.5), V(-3.78, .78, 0), 30],
